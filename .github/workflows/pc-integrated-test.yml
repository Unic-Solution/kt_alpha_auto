name: KT ALPHA 통합 테스트(PC)

on:
  workflow_dispatch:
    inputs:
      slack_thread_ts:
        description: '진행상황을 표시할 Slack 스레드 timestamp'
        required: false
        type: string

permissions:
  contents: write

jobs:
  test:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: Playwright 브라우저 설치
        run: npx playwright install chromium --with-deps

      - name: PC 통합 테스트 실행
        id: test
        env:
          SLACK_NOTIFICATIONS_ENABLED: 'true'
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_THREAD_TS: ${{ inputs.slack_thread_ts }}
          LOGIN_ID: ${{ secrets.LOGIN_ID }}
          LOGIN_PW: ${{ secrets.LOGIN_PW }}
          NAME: ${{ secrets.NAME }}
          YEAR: ${{ secrets.YEAR }}
          MONTH: ${{ secrets.MONTH }}
          DAY: ${{ secrets.DAY }}
          PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}
          BASE_URL: https://www.kshop.co.kr/
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL이 없어 로그인·본인인증 알림을 보낼 수 없습니다."
          elif [ -z "$SLACK_THREAD_TS" ]; then
            echo "::warning::Slack 스레드 timestamp가 없어 사용자 작업 알림은 채널 메시지로 전송됩니다."
          else
            echo "Slack 로그인·본인인증 알림을 현재 테스트 스레드로 전송합니다."
          fi
          npx playwright test tests/pc/integrated --project=pc-no-auth --headed
        continue-on-error: true

      - name: 이전 히스토리 복원
        if: always()
        run: |
          mkdir -p allure-results/history
          cp -r allure-history/. allure-results/history/ 2>/dev/null || true

      - name: Allure 리포트 생성
        if: always()
        run: |
          npx allure generate allure-results --clean -o allure-report
          sed -i '' 's/lang="en"/lang="kr"/' allure-report/index.html
          sed -i '' 's/sorter:`sorter.name`/sorter:`sorter.order`/' allure-report/assets/*.js

      - name: GitHub Pages 배포
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report

      - name: 히스토리 develop 브랜치에 누적
        if: always()
        run: |
          TEMP=$(mktemp -d)
          git clone --depth=1 --branch=develop https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/HUJO733/kt_alpha_auto.git "$TEMP"
          rm -rf "$TEMP/allure-history"
          cp -r allure-report/history "$TEMP/allure-history"
          cd "$TEMP"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add allure-history/
          git diff --cached --quiet || git commit -m "chore: Allure 히스토리 업데이트 [skip ci]"
          git push origin develop
          cd -
          rm -rf "$TEMP"

      - name: Slack 알림
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_THREAD_TS: ${{ inputs.slack_thread_ts }}
        run: |
          STATUS="${{ steps.test.outcome }}"
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
            TEXT="통과"
          else
            EMOJI="❌"
            TEXT="실패"
          fi

          send_slack() {
            THREAD_FIELD=""
            if [ -n "$1" ]; then
              THREAD_FIELD=", \"thread_ts\": \"$1\""
            fi
            curl -sS -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-type: application/json' \
              --data "{
              \"blocks\": [
                {
                  \"type\": \"header\",
                  \"text\": {\"type\": \"plain_text\", \"text\": \"${EMOJI} PC 통합 테스트 ${TEXT}\"}
                },
                {
                  \"type\": \"section\",
                  \"text\": {\"type\": \"mrkdwn\", \"text\": \"<https://hujo733.github.io/kt_alpha_auto|📊 Allure 리포트 보기>\"}
                }
              ]${THREAD_FIELD}
            }"
          }

          RESPONSE=$(send_slack "$SLACK_THREAD_TS")
          if [ "$RESPONSE" != "ok" ] && [ -n "$SLACK_THREAD_TS" ]; then
            echo "Slack 스레드 알림 실패(${RESPONSE}), 채널 메시지로 재전송합니다."
            RESPONSE=$(send_slack "")
          fi
          if [ "$RESPONSE" != "ok" ]; then
            echo "::warning::Slack 최종 결과 알림 전송 실패: ${RESPONSE}"
          fi

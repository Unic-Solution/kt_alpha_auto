name: KT ALPHA 통합 테스트(PC)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm install

      - name: Playwright 브라우저 설치
        run: npx playwright install chromium

      - name: 타임스탬프 설정
        run: echo "RUN_TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)" >> $GITHUB_ENV

      - name: 이전 테스트 결과 초기화
        run: rm -rf allure-results && mkdir -p allure-results

      - name: PC 통합 테스트 실행
        id: test
        env:
          LOGIN_ID: ${{ secrets.LOGIN_ID }}
          LOGIN_PW: ${{ secrets.LOGIN_PW }}
          NAME: ${{ secrets.NAME }}
          YEAR: ${{ secrets.YEAR }}
          MONTH: ${{ secrets.MONTH }}
          DAY: ${{ secrets.DAY }}
          PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}
          BASE_URL: https://www.kshop.co.kr/
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: npx playwright test tests/pc/integrated --project=pc-no-auth --headed
        continue-on-error: true

      - name: Allure 리포트 생성
        if: always()
        run: |
          npx allure generate allure-results --clean -o allure-report
          sed -i '' 's/lang="en"/lang="kr"/' allure-report/index.html
          sed -i '' 's/sorter:`sorter.name`/sorter:`sorter.order`/' allure-report/assets/*.js
          sed -i '' 's|<head>|<head><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">|' allure-report/index.html

      - name: GitHub Pages 배포
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: runs/${{ env.RUN_TIMESTAMP }}
          keep_files: true

      - name: 히스토리 develop 브랜치에 누적
        if: always()
        run: |
          TEMP=$(mktemp -d)
          git clone --depth=1 --branch=develop https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/HUJO733/kt_alpha_auto.git "$TEMP"
          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
          mkdir -p "$TEMP/allure-runs"
          cp allure-results/*-result.json "$TEMP/allure-runs/" 2>/dev/null || true
          cd "$TEMP"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add allure-runs/
          git diff --cached --quiet || git commit -m "chore: 테스트 결과 누적 [$TIMESTAMP] [skip ci]"
          git push origin develop
          cd -
          rm -rf "$TEMP"

      - name: 임시 파일 정리
        if: always()
        run: rm -rf ~/actions_github_pages_*

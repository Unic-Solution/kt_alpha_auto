name: KT ALPHA 누적 결과 리포트

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: 코드 체크아웃 (develop)
        uses: actions/checkout@v4
        with:
          ref: develop
          clean: false

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치 (Mac)
        if: runner.os == 'macOS'
        run: |
          LOCK_HASH=$(md5 -q package-lock.json)
          HASH_FILE="node_modules/.npm-lock-hash"
          if [ -f "$HASH_FILE" ] && [ "$(cat $HASH_FILE)" = "$LOCK_HASH" ]; then
            echo "변경 없음, npm install 건너뜀"
          else
            npm install
            echo "$LOCK_HASH" > $HASH_FILE
          fi

      - name: 의존성 설치 (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $lockHash = (Get-FileHash package-lock.json -Algorithm MD5).Hash
          $hashFile = "node_modules/.npm-lock-hash"
          if ((Test-Path $hashFile) -and ((Get-Content $hashFile) -eq $lockHash)) {
            Write-Host "변경 없음, npm install 건너뜀"
          } else {
            npm install
            $lockHash | Set-Content $hashFile
          }

      - name: Allure 리포트 생성 및 HTML 수정 (Mac)
        if: runner.os == 'macOS'
        run: |
          mkdir -p allure-combined
          find allure-runs -name '*-result.json' -exec cp {} allure-combined/ \;
          npx allure generate allure-combined --clean -o allure-report-history
          rm -rf allure-combined
          sed -i '' 's/lang="en"/lang="kr"/' allure-report-history/index.html
          sed -i '' 's/sorter:`sorter.name`/sorter:`sorter.order`/' allure-report-history/assets/*.js
          sed -i '' 's|<head>|<head><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">|' allure-report-history/index.html

      - name: Allure 리포트 생성 및 HTML 수정 (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path allure-combined -Force
          Get-ChildItem allure-runs -Recurse -Filter '*-result.json' | ForEach-Object { Copy-Item $_.FullName allure-combined/ }
          npx allure generate allure-combined --clean -o allure-report-history
          Remove-Item -Recurse -Force allure-combined
          (Get-Content allure-report-history/index.html -Encoding UTF8) -replace 'lang="en"', 'lang="kr"' | Set-Content allure-report-history/index.html -Encoding UTF8
          Get-ChildItem allure-report-history/assets/*.js | ForEach-Object { (Get-Content $_ -Encoding UTF8) -replace 'sorter:`sorter.name`', 'sorter:`sorter.order`' | Set-Content $_ -Encoding UTF8 }
          (Get-Content allure-report-history/index.html -Encoding UTF8) -replace '<head>', '<head><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">' | Set-Content allure-report-history/index.html -Encoding UTF8

      - name: GitHub Pages 배포
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report-history
          destination_dir: history
          keep_files: true

      - name: Slack 알림
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_DEV_CHANNEL_ID }}
          SLACK_TEXT: "📊 누적 결과 리포트 생성 완료\n<https://unic-solution.github.io/kt_alpha_auto/history/|Allure-history-report>"
        run: |
          node -e "
          const https = require('https');
          const data = JSON.stringify({
            channel: process.env.SLACK_CHANNEL_ID,
            text: process.env.SLACK_TEXT.replace('\\\\n', '\\n')
          });
          const req = https.request({
            hostname: 'slack.com',
            path: '/api/chat.postMessage',
            method: 'POST',
            headers: {
              'Authorization': 'Bearer ' + process.env.SLACK_BOT_TOKEN,
              'Content-Type': 'application/json',
              'Content-Length': Buffer.byteLength(data)
            }
          }, res => res.resume());
          req.write(data);
          req.end();
          "
